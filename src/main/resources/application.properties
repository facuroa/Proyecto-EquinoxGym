server.port=${SERVER_PORT:8085}

# La sesion dura toda la jornada: con los 30 minutos que trae Spring por
# defecto, el mostrador quedaba afuera cada vez que el gimnasio pasaba un rato
# sin movimiento y habia que volver a iniciar sesion.
server.servlet.session.timeout=${SESSION_TIMEOUT:10h}

# Los secretos locales viven en application-local.properties, que no se versiona.
# En servidores se pueden proporcionar directamente mediante variables de entorno.
#
# El archivo se lee de la raiz del proyecto (file:) y no del classpath: dentro
# de src/main/resources Maven lo empaquetaba adentro del jar y esa contrasena
# de desarrollo pisaba a la de equinox.env en la PC del gimnasio, que fallaba
# con "Access denied" sin explicacion.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/equinoxgym?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

equinox.bootstrap-admin.username=${EQUINOX_ADMIN_USERNAME:admin}
equinox.bootstrap-admin.password=${EQUINOX_ADMIN_PASSWORD:}

# Branding por instalacion: cada gimnasio puede tener su propio nombre y logo
# sin tocar el codigo. El logo se sirve desde GYM_LOGO_PATH si esta configurado;
# si no, se usa el logo por defecto embebido en la aplicacion.
equinox.branding.gym-name=${GYM_NAME:Keep Fit Gym}
equinox.branding.logo-path=${GYM_LOGO_PATH:}

# Notificaciones por email (comprobante de pago y recordatorio de vencimiento).
# Apagadas por defecto: no se manda nada hasta cargar credenciales reales de
# una cuenta de Gmail con "contrasena de aplicacion" en equinox.env.
equinox.notificaciones.email.habilitado=${EMAIL_NOTIFICACIONES_HABILITADO:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Dias de anticipacion con los que se manda el recordatorio de vencimiento.
equinox.recordatorios.dias-anticipacion=${RECORDATORIO_DIAS_ANTICIPACION:3}
